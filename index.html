<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmglish — graj i ucz się angielskiego</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b8cff'/%3E%3Cg fill='%23fff'%3E%3Crect x='11' y='14' width='5' height='6' rx='1' opacity='.6'/%3E%3Crect x='11' y='29' width='5' height='6' rx='1' opacity='.6'/%3E%3Crect x='11' y='44' width='5' height='6' rx='1' opacity='.6'/%3E%3Cpath d='M27 20 L47 32 L27 44 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b8cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filmglish">
<link rel="apple-touch-icon" href="icon-192.png">
<meta http-equiv="refresh" content="3;url=player.html">
<style>
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e8ecff;
    background:radial-gradient(circle at 30% 15%,#2a1f45,#0f1226);overflow:hidden}
  .splash{text-align:center;animation:fade .8s ease}
  .logo{filter:drop-shadow(0 10px 30px rgba(91,140,255,.55));animation:pop .9s cubic-bezier(.2,.9,.3,1.2)}
  h1{margin:18px 0 2px;font-size:40px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(135deg,#8fb0ff,#ff8fb0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0;color:#9aa3c7;font-size:14px}
  .loader{width:160px;height:5px;border-radius:5px;background:#232a4d;margin:26px auto 0;overflow:hidden}
  .loader::after{content:"";display:block;height:100%;width:40%;border-radius:5px;
    background:linear-gradient(90deg,#5b8cff,#ff5b8c);animation:slide 1.2s ease-in-out infinite}
  .enter{margin-top:22px}
  .enter a{color:#8fb0ff;text-decoration:none;font-size:14px}
  .admin-link{position:fixed;bottom:16px;color:#5b6488;font-size:12px;text-decoration:none}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
</style>
</head>
<body>
  <div class="splash">
    <span class="logo">
      <svg viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
        <defs><linearGradient id="fgSplash" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#ff5b8c"/>
        </linearGradient></defs>
        <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#fgSplash)"/>
        <g fill="#fff">
          <rect x="11" y="14" width="5" height="6" rx="1" opacity=".6"/>
          <rect x="11" y="29" width="5" height="6" rx="1" opacity=".6"/>
          <rect x="11" y="44" width="5" height="6" rx="1" opacity=".6"/>
          <path d="M27 20 L47 32 L27 44 Z"/>
        </g>
      </svg>
    </span>
    <h1>Filmglish</h1>
    <p class="sub">od Angielskiwnet</p>
    <div class="loader"></div>
    <p class="enter"><a href="player.html">Wejdź do gry →</a></p>
  </div>
  <a class="admin-link" href="admin.html">Panel nauczyciela</a>
  <script>setTimeout(function(){location.replace('player.html');},1600);</script>
</body>
</html>
